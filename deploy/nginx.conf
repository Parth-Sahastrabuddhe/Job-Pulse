# JobLookout HTTPS reverse proxy. This file is included from nginx's http{} block.
# Certificate provisioning is intentionally separate; deploy/setup.sh refuses to
# install this configuration until the certificate and key already exist.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Never serve application traffic over plaintext HTTP. Use a fixed canonical
# host rather than the untrusted Host header when constructing the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name joblookout.app www.joblookout.app;

    # Certbot's webroot renewal challenge must remain available over HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://joblookout.app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name joblookout.app www.joblookout.app;

    ssl_certificate     /etc/letsencrypt/live/joblookout.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joblookout.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:JobLookoutTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # Disable obsolete browser XSS filters; CSP is the authoritative policy.
    add_header X-XSS-Protection "0" always;

    # Keep host-only session/OAuth cookies on one canonical origin.
    if ($host = www.joblookout.app) {
        return 308 https://joblookout.app$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, rather than append to, inbound forwarding headers. The app
        # only trusts X-Real-IP when TRUST_PROXY=nginx is explicitly configured.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
